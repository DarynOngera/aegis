name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      - run: mix format --check-formatted
      - run: MIX_ENV=test mix compile --warnings-as-errors
      - run: mix test

  # Discovery job: runs the suite against real Hex, mix_audit and the EEF feed, which the
  # unit tests cannot reach. Not blocking until the expectations below have been confirmed.
  integration:
    needs: unit
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: clean, expect: pass }
          - { project: vulnerable, expect: fail }
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      - name: Fetch deps
        working-directory: integration/${{ matrix.project }}
        run: mix deps.get
      - name: Run suite
        working-directory: integration/${{ matrix.project }}
        run: |
          set +e
          MIX_ENV=test mix test test/security 2>&1 | tee out.log
          status=${PIPESTATUS[0]}
          echo "suite exit status: $status (expected: ${{ matrix.expect }})"
          if [ "${{ matrix.expect }}" = pass ] && [ "$status" -ne 0 ]; then exit 1; fi
          if [ "${{ matrix.expect }}" = fail ] && [ "$status" -eq 0 ]; then
            echo "::error::expected findings, suite passed"; exit 1
          fi
      - name: Surface suite output as an annotation
        if: always()
        working-directory: integration/${{ matrix.project }}
        run: |
          # Logs and artifacts sit behind storage that API clients cannot always reach;
          # annotations are readable through the checks API.
          msg=$(head -c 6000 out.log | tr -d '\r' | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::warning title=suite output (${{ matrix.project }})::$msg"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suite-log-${{ matrix.project }}
          path: integration/${{ matrix.project }}/out.log

  # Temporary: find out why per-record OSV fetches return HTTP 406.
  eef-probe:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Probe EEF OSV endpoints
        run: |
          base=https://cna.erlef.org
          id=EEF-CVE-2025-4748
          report=""
          probe() { # label, then curl args
            label=$1; shift
            res=$(curl -sS -m 20 -o /tmp/body -w "%{http_code} %{content_type}" "$@" 2>&1)
            report+="$label => $res | $(head -c 160 /tmp/body | tr '\n\r' '  ')"$'\n'
          }
          probe "index default accept"      "$base/osv/all.json"
          probe "index accept json"         -H "Accept: application/json" "$base/osv/all.json"
          probe "record .json default"      "$base/osv/$id.json"
          probe "record .json accept json"  -H "Accept: application/json" "$base/osv/$id.json"
          probe "record no-ext default"     "$base/osv/$id"
          probe "record no-ext accept json" -H "Accept: application/json" "$base/osv/$id"
          probe "cves record .json default" "$base/cves/CVE-2025-4748.json"
          probe "cves index.json default"   "$base/cves/index.json"
          # Shape of the feed: which ecosystems and range types do records use?
          mkdir -p /tmp/osv
          curl -sS "$base/osv/all.json" | jq -r '.[].id' \
            | xargs -P8 -I{} curl -sS -m 30 -o "/tmp/osv/{}.json" "$base/osv/{}.json"
          shape=$(jq -r '.affected[]? | [(.package.ecosystem // "none"), (.package.name // "none" | .[0:0]), ([.ranges[]?.type] | join("+")), ((.versions // []) | length > 0)] | @tsv' /tmp/osv/*.json | sort | uniq -c | sort -rn)
          report+=$'\n--- shape (count, ecosystem, _, range types, has versions)\n'"$shape"$'\n'
          hexid=$(grep -l '"ecosystem":"Hex"' /tmp/osv/*.json | head -1)
          report+=$'\n--- first Hex record: '"$hexid"$'\n'"$(head -c 2500 "$hexid" 2>/dev/null)"$'\n'
          msg=$(printf '%s' "$report" | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::warning title=eef-probe::$msg"
