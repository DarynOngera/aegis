name: release

# Publishes the scanner image to GitHub Container Registry when a version tag is pushed:
#   git tag v0.2.0 && git push origin v0.2.0
# The tag must match @version in mix.exs. The job summary prints the image digest; pin that
# digest (name@sha256:...) in CI instead of a tag.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The tag matches mix.exs
        run: |
          version=$(sed -n 's/^  @version "\(.*\)"$/\1/p' mix.exs)
          test -n "$version"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match @version ${version} in mix.exs"
            exit 1
          fi
          echo "VERSION=${version}" >>"$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >>"$GITHUB_ENV"

      - name: Build
        run: |
          docker build \
            --build-arg VERSION="${VERSION}" \
            --build-arg REVISION="${GITHUB_SHA}" \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:latest" \
            .

      - name: Smoke test
        run: docker run --rm "${IMAGE}:${VERSION}" version | grep -q "^dep_guard ${VERSION}$"

      - name: Push and print the digest
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${VERSION}")
          {
            echo "### Scanner image published"
            echo
            echo "Pin this in CI:"
            echo
            echo '```'
            echo "${digest}"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
