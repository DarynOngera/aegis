# Copy to .github/workflows/dependency-security.yml in your project.
#
# Runs on every pull request, and nightly so that advisories published after your last merge
# still turn the build red. To block merging, add the "scan" check to branch protection.
name: dependency-security

on:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # security-events: write   # only if you turn on upload-sarif below

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Optional: the shared org policy, checked out next to the project. Pin ref to a commit SHA.
      # - uses: actions/checkout@v4
      #   with:
      #     repository: acme/security-policy
      #     ref: <commit sha>
      #     path: .org-policy

      # Pin this action to a commit SHA, and the image to a digest (see USAGE.md, section 6).
      - uses: DarynOngera/aegis@v0.2.0
        with:
          image: ghcr.io/darynongera/aegis@sha256:<digest>
          # org-policy: .org-policy/org.dep_guard.exs
          # org-policy-sha256: ${{ vars.DEP_GUARD_ORG_POLICY_SHA256 }}
          # upload-sarif: "true"        # code scanning; private repos need Advanced Security
          # working-directory: apps/web # when mix.lock is not at the repository root
